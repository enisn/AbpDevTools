name: Nuget Publish Pipeline

on: workflow_dispatch

# Creating the GitHub release and its tag needs write access to repository contents.
permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 10.0.100-rc.2.25502.107
    - name: Restore
      run: dotnet restore
    - name: Pack
      run: dotnet pack ./src/AbpDevTools/AbpDevTools.csproj -c Release --include-symbols --include-source -o ./nupkg
    - name: Push
      run: dotnet nuget push './nupkg/*.symbols.nupkg' --source ${{secrets.NUGET_SOURCE}} --api-key ${{secrets.NUGET_KEY}} --skip-duplicate
      #continue-on-error: true
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        version=$(dotnet msbuild ./src/AbpDevTools/AbpDevTools.csproj -getProperty:Version)
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Could not read a valid version from AbpDevTools.csproj (got '$version')."
          exit 1
        fi

        tag="v$version"
        if gh release view "$tag" > /dev/null 2>&1; then
          echo "::notice::Release $tag already exists, skipping. Bump <Version> in AbpDevTools.csproj to publish a new release."
          exit 0
        fi

        prerelease=()
        if [[ "$version" == *-* ]]; then
          prerelease=(--prerelease)
        fi

        gh release create "$tag" ./nupkg/*.nupkg \
          --title "$tag" \
          --target "$GITHUB_SHA" \
          --generate-notes \
          "${prerelease[@]}"
